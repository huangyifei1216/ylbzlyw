<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#29483A" />
    <title>一两步｜开发体验</title>
    <link rel="icon" href="./favicon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./styles-brand.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script>
      // Modules cannot be loaded from file:// in Chromium. Keep a direct
      // double-click from showing a broken activation form.
      if (location.protocol === "file:") {
        document.querySelector("#app").innerHTML = `
          <main class="auth-page file-preview-notice">
            <section class="auth-card">
              <p class="overline">开发体验</p>
              <h2>请从本地开发链接打开</h2>
              <p>直接双击 HTML 会被浏览器拦截，内测码无法生效。</p>
              <a class="brand-button full-button" href="http://127.0.0.1:4173/">打开一两步开发版 <span>→</span></a>
              <small>打开后可使用：BB-ALL-0001</small>
            </section>
          </main>`;
      } else {
        // dev.html is deliberately outside the production publish allowlist.
        globalThis.__YLB_CONFIG__ = globalThis.__YLB_CONFIG__ && typeof globalThis.__YLB_CONFIG__ === "object"
          ? globalThis.__YLB_CONFIG__
          : { environment: "development", handbookUrl: "" };
        const appModule = document.createElement("script");
        appModule.type = "module";
        appModule.textContent = 'globalThis.__YLB_DEMO_ACCESS__ = await import("./demo-access.mjs"); await import("./app.js");';
        document.body.append(appModule);
      }
    </script>
  </body>
</html>
