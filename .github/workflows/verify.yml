name: Verify V5.1.4

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run domain and contract tests
        run: npm test

      - name: Build production allowlist
        run: npm run build:production

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run mobile browser tests
        run: npm run test:e2e

      - name: Upload Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          if-no-files-found: ignore
          retention-days: 14
          path: |
            test-results/
            playwright-report/
            artifacts/screenshots/
