name: Verify and deploy V5.1.4

on:
  push:
    branches: [dev]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && 'dev' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run domain and contract tests
        run: npm test

      - name: Build production allowlist
        run: npm run build:production

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run mobile browser tests
        run: npm run test:e2e

      - name: Upload verified production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: verified-production-dist
          path: dist

      - name: Upload Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          if-no-files-found: ignore
          retention-days: 14
          path: |
            test-results/
            playwright-report/
            artifacts/screenshots/

  deploy:
    needs: verify
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy verified production artifact
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: verified-production-dist
