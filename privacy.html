      <h1>隐私说明</h1>
      <p>当前 H5 演示版会把开通状态、孩子昵称与生日、相伴时刻和每周家庭计划保存在这台设备的浏览器中，不上传服务器。清除浏览器数据、使用无痕模式或更换设备可能导致记录丢失，请按需使用“导出本机记录”。</p>
      <p>请不要输入儿童真实姓名、学校、住址、电话、证件号码或其他可识别个人身份的信息。</p>
      <p>一两步提供的是一般性亲子陪伴建议，不评价孩子能力，不提供医学或心理诊断、治疗，也不能替代医生、心理咨询师、发育评估师及其他合格专业人员。</p>
      <p>若孩子或他人正面临立即危险、严重身体不适、自伤或伤人风险，请停止使用本工具，立刻联系当地急救、警方或合格专业人员。</p>
